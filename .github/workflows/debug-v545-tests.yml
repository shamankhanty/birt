name: Debug v5.4.5 core tests

on:
  push:
    branches:
      - fix/physician500-operational-history-v545
    paths:
      - .github/workflows/debug-v545-tests.yml

permissions:
  contents: write

jobs:
  debug-core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/physician500-operational-history-v545
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Capture core test output
        shell: bash
        run: |
          set +e
          mapfile -t core_tests < <(
            find tests -maxdepth 1 -name '*.test.mjs' \
              ! -name 'rendered-html.test.mjs' \
              ! -name 'update-adapters.test.mjs' \
              ! -name 'update-pipeline.test.mjs' \
              -print | sort
          )
          node --test "${core_tests[@]}" > debug-v545-test-output.txt 2>&1
          status=$?
          printf '\nEXIT_CODE=%s\n' "$status" >> debug-v545-test-output.txt
          cat debug-v545-test-output.txt
          exit 0
      - name: Commit captured output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug-v545-test-output.txt
          git commit -m "chore: capture v5.4.5 core test failure" || exit 0
          git push origin HEAD:fix/physician500-operational-history-v545
