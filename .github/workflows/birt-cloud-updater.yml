name: BIRT Cloud Updater v3

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write
  actions: write

concurrency:
  group: birt-cloud-updater
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && (startsWith(github.event.issue.title, 'BIRT UPDATE') || startsWith(github.event.issue.title, 'BIRT PUBLISH') || startsWith(github.event.issue.title, 'BIRT ARCHIVE VERIFIED')))
    runs-on: ubuntu-latest
    env:
      YANDEX_DISK_TOKEN: ${{ secrets.YANDEX_DISK_TOKEN }}
      BIRT_YANDEX_INBOX: "disk:/!МЗ РТ/!Синк 05 08 26/BIRT/BIRT/INBOX"
      BIRT_YANDEX_ARCHIVE: "disk:/!МЗ РТ/!Синк 05 08 26/BIRT/BIRT/ARCHIVE"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          python -m pip install --disable-pip-version-check openpyxl

      - name: Download Yandex Disk INBOX
        run: python scripts/yandex_disk_inbox.py --remote "$BIRT_YANDEX_INBOX" --output "$RUNNER_TEMP/BIRT/INBOX"

      - name: Prepare cloud workspace
        run: mkdir -p "$RUNNER_TEMP/BIRT/ARCHIVE" "$RUNNER_TEMP/BIRT/REPORTS"

      - name: Run deterministic BIRT updater
        id: updater
        continue-on-error: true
        run: |
          python scripts/local_updater_v2.py --inbox "$RUNNER_TEMP/BIRT/INBOX" --output "$RUNNER_TEMP/BIRT/REPORTS" --settle 0 --force | tee "$RUNNER_TEMP/BIRT/console.txt"
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Package result
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/BIRT/result"
          cp -a "$RUNNER_TEMP/BIRT/REPORTS/." "$RUNNER_TEMP/BIRT/result/" || true
          cp "$RUNNER_TEMP/BIRT/console.txt" "$RUNNER_TEMP/BIRT/result/console.txt" || true
          python - <<'PY'
          import json, os
          from pathlib import Path
          from openpyxl import load_workbook
          inbox=Path(os.environ["RUNNER_TEMP"])/"BIRT"/"INBOX"
          out=Path(os.environ["RUNNER_TEMP"])/"BIRT"/"result"/"source-diagnostics.json"
          result=[]
          for p in sorted(inbox.glob("*.xlsx")):
              if "медкниж" not in p.name.lower() and "госпитал" not in p.name.lower():
                  continue
              wb=load_workbook(p, read_only=True, data_only=True)
              book={"file":p.name,"sheets":[]}
              for ws in wb.worksheets:
                  rows=[]
                  for row in ws.iter_rows(min_row=1,max_row=min(ws.max_row,25),values_only=True):
                      vals=[str(v)[:300] for v in row if v not in (None,"")]
                      if vals: rows.append(vals)
                  book["sheets"].append({"title":ws.title,"max_row":ws.max_row,"max_column":ws.max_column,"first_nonempty_rows":rows})
              result.append(book)
          out.write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding="utf-8")
          PY

      - name: Promote accepted candidate to main
        id: promotion
        if: github.event_name == 'issues' && startsWith(github.event.issue.title, 'BIRT PUBLISH') && steps.updater.outputs.exit_code == '0'
        run: |
          report=$(find "$RUNNER_TEMP/BIRT/REPORTS" -mindepth 2 -maxdepth 2 -name report.json | sort | tail -1)
          if [ -z "$report" ]; then
            echo "No updater report: INBOX produced no candidate. Skipping promotion; current production remains unchanged."
            echo "no_candidate=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          run_dir=$(dirname "$report")
          node scripts/promote-current-production.mjs --candidate "$run_dir"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app baseline validation
          if git diff --cached --quiet; then
            echo "Validated candidate matches current production; no commit required."
          else
            git commit -m "Update dashboard from Yandex Disk INBOX"
            git push origin HEAD:main
          fi

      - name: Archive verified unchanged legacy INBOX files
        if: github.event_name == 'issues' && startsWith(github.event.issue.title, 'BIRT ARCHIVE VERIFIED') && steps.updater.outputs.exit_code == '0'
        run: |
          python scripts/yandex_disk_inbox.py --remote "$BIRT_YANDEX_INBOX" --archive-to "$BIRT_YANDEX_ARCHIVE" \
            --name "Отчет_по_госпитализациям__-_01.01.2026-17.09.2026.xlsx" \
            --name "Отчет_по_законченному_случаю_амбулаторный_ - 01.01.2026-17.09.2026.xlsx"

      - name: Archive successfully published Yandex Disk INBOX
        if: steps.promotion.outcome == 'success' && steps.promotion.outputs.no_candidate != 'true'
        run: python scripts/yandex_disk_inbox.py --remote "$BIRT_YANDEX_INBOX" --archive-to "$BIRT_YANDEX_ARCHIVE"

      - name: Trigger GitHub Pages deployment
        if: steps.promotion.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main

      - name: Upload candidate and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: birt-cloud-update-result
          path: ${{ runner.temp }}/BIRT/result
          if-no-files-found: error
          retention-days: 30

      - name: Fail only on STOP/system failure
        if: always()
        run: |
          code="${{ steps.updater.outputs.exit_code }}"
          if [ -z "$code" ]; then
            echo "Updater did not return an exit code."
            exit 2
          fi
          if [ "$code" = "2" ]; then
            echo "BIRT updater returned STOP."
            exit 2
          fi
          exit 0
