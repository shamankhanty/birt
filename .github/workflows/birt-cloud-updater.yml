name: BIRT Cloud Updater v3

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write

concurrency:
  group: birt-cloud-updater
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && (startsWith(github.event.issue.title, 'BIRT UPDATE') || startsWith(github.event.issue.title, 'BIRT PUBLISH')))
    runs-on: ubuntu-latest
    env:
      YANDEX_DISK_TOKEN: ${{ secrets.YANDEX_DISK_TOKEN }}
      BIRT_YANDEX_INBOX: "disk:/!МЗ РТ/!Синк 05 08 26/BIRT/BIRT/INBOX"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund
          python -m pip install --disable-pip-version-check openpyxl

      - name: Download Yandex Disk INBOX
        run: python scripts/yandex_disk_inbox.py --remote "$BIRT_YANDEX_INBOX" --output "$RUNNER_TEMP/BIRT/INBOX"

      - name: Prepare cloud workspace
        run: mkdir -p "$RUNNER_TEMP/BIRT/ARCHIVE" "$RUNNER_TEMP/BIRT/REPORTS"

      - name: Run deterministic BIRT updater
        id: updater
        continue-on-error: true
        run: |
          python scripts/local_updater_v2.py --inbox "$RUNNER_TEMP/BIRT/INBOX" --output "$RUNNER_TEMP/BIRT/REPORTS" --settle 0 --force | tee "$RUNNER_TEMP/BIRT/console.txt"
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Package result
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/BIRT/result"
          cp -a "$RUNNER_TEMP/BIRT/REPORTS/." "$RUNNER_TEMP/BIRT/result/" || true
          cp "$RUNNER_TEMP/BIRT/console.txt" "$RUNNER_TEMP/BIRT/result/console.txt" || true
          python - <<'PY'
          import json, os
          from pathlib import Path
          from openpyxl import load_workbook
          inbox=Path(os.environ["RUNNER_TEMP"])/"BIRT"/"INBOX"
          out=Path(os.environ["RUNNER_TEMP"])/"BIRT"/"result"/"source-diagnostics.json"
          result=[]
          for p in sorted(inbox.glob("*.xlsx")):
              if "медкниж" not in p.name.lower() and "госпитал" not in p.name.lower():
                  continue
              wb=load_workbook(p, read_only=True, data_only=True)
              book={"file":p.name,"sheets":[]}
              for ws in wb.worksheets:
                  rows=[]
                  for row in ws.iter_rows(min_row=1,max_row=min(ws.max_row,25),values_only=True):
                      vals=[str(v)[:300] for v in row if v not in (None,"")]
                      if vals: rows.append(vals)
                  book["sheets"].append({"title":ws.title,"max_row":ws.max_row,"max_column":ws.max_column,"first_nonempty_rows":rows})
              result.append(book)
          out.write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding="utf-8")
          PY

      - name: Promote accepted candidate to main
        if: github.event_name == 'issues' && startsWith(github.event.issue.title, 'BIRT PUBLISH') && steps.updater.outputs.exit_code == '0'
        run: |
          report=$(find "$RUNNER_TEMP/BIRT/REPORTS" -mindepth 2 -maxdepth 2 -name report.json | sort | tail -1)
          if [ -z "$report" ]; then echo "No updater report"; exit 2; fi
          candidate=$(python - "$report" <<'PY'
          import json,sys
          from pathlib import Path
          report=Path(sys.argv[1])
          d=json.loads(report.read_text(encoding='utf-8'))
          print(d.get('candidateDir') or str(report.parent/'candidate'))
          PY
          )
          manifest="$candidate/staging-manifest.json"
          python - "$manifest" <<'PY'
          import json,sys
          from pathlib import Path
          d=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          if d['formalValidation']['status']=='FAIL' or d['formalValidation']['summary']['blocking']:
              raise SystemExit('Candidate has blocking validation failures')
          if not d.get('changedFiles'):
              raise SystemExit('Candidate has no changes')
          print('Promoting:', ', '.join(d['changedFiles']))
          PY
          python - "$manifest" "$candidate/app" app <<'PY'
          import json,shutil,sys
          from pathlib import Path
          m=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          src,dst=Path(sys.argv[2]),Path(sys.argv[3])
          for name in m['changedFiles']:
              shutil.copy2(src/name,dst/name)
          PY
          node scripts/run-validation.mjs
          npm test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          git commit -m "Update dashboard from Yandex Disk INBOX"
          git push origin HEAD:main

      - name: Upload candidate and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: birt-cloud-update-result
          path: ${{ runner.temp }}/BIRT/result
          if-no-files-found: error
          retention-days: 30

      - name: Fail only on STOP/system failure
        if: always()
        run: |
          code="${{ steps.updater.outputs.exit_code }}"
          if [ -z "$code" ]; then
            echo "Updater did not return an exit code."
            exit 2
          fi
          if [ "$code" = "2" ]; then
            echo "BIRT updater returned STOP."
            exit 2
          fi
          exit 0
