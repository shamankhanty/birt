name: Apply v5.2.1 navigation and labels

on:
  push:
    paths:
      - '.github/workflows/apply-v521-navigation.yml'
      - 'scripts/apply_v521_navigation.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply v5.2.1 patch
        run: python scripts/apply_v521_navigation.py

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate diff
        run: git diff --check

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app config lib methodology scripts tests README.md STATE.md OPEN_ISSUES.md SOURCE_PACKAGE.md
          git commit -m "v5.2.1: МСР/МСС и новый порядок разделов"
          git push
