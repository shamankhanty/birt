name: Fix v5.4.5 history aggregation

on:
  push:
    branches:
      - fix/physician500-operational-history-v545
    paths:
      - .github/workflows/fix-v545-history.yml

permissions:
  contents: write

jobs:
  fix-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/physician500-operational-history-v545
          fetch-depth: 0
      - name: Aggregate same-day release history
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/page.tsx')
          text = path.read_text(encoding='utf-8')
          start_marker = '  {\n    version: "5.4.5",'
          end_marker = '  {\n    version: "5.4.2",'
          start = text.find(start_marker)
          end = text.find(end_marker, start + 1)
          if start < 0 or end < 0:
              raise SystemExit('version history markers not found')

          merged = '''  {
            version: "5.4.5",
            date: "15.09.2026",
            items: [
              "Оперативный режим показателей 500+ теперь использует фактический срез 11.09 из physician-weekly-snapshot, а месячный режим сохраняет полный август отдельно.",
              "История обновлений автоматически объединяет все технические версии одной даты в одну пользовательскую карточку с накоплением изменений.",
              "Для накопительных долевых показателей в оперативной динамике добавлены числитель и знаменатель текущего и предыдущего срезов, а также их изменение.",
              "Уменьшение накопительного числителя или знаменателя автоматически помечается как аномалия качества данных; отсутствующие компоненты предыдущего среза не восстанавливаются из процента.",
              "В разделе показателей оперативная динамика теперь сравнивает текущую выгрузку с непосредственно предыдущей с указанием дат, абсолютной разницы и относительного изменения для количественных показателей.",
              "Переключатель «Неделя» заменён на «Оперативно»; месячная динамика по-прежнему рассчитывается только по сопоставимым полным месяцам.",
            ],
          },
          '''
          path.write_text(text[:start] + merged + text[end:], encoding='utf-8')

          updated = path.read_text(encoding='utf-8')
          history_start = updated.index('const versionHistoryEntries = [')
          history_end = updated.index('];', history_start)
          history = updated[history_start:history_end]
          if 'version: "5.4.4"' in history or 'version: "5.4.3"' in history:
              raise SystemExit('technical same-day entries remain in version history')
          if history.count('version: "5.4.5"') != 1:
              raise SystemExit('expected exactly one v5.4.5 history entry')
          PY
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet -- app/page.tsx; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx
          git commit -m "fix: aggregate v5.4.5 release history"
          git push origin HEAD:fix/physician500-operational-history-v545
