name: Deploy dashboard to GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: ["main"]
    paths-ignore:
      - "README.md"
      - "STATE.md"
      - "OPEN_ISSUES.md"
      - "SOURCE_PACKAGE.md"
      - "REDEPLOY_*.md"
      - "docs/**"
      - "methodology/**"
      - "data_sources/**"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # V543_BOOTSTRAP_START
      - name: Bootstrap v5.4.3 operational dynamics
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/operational-export-dynamics-v543'
        shell: bash
        run: |
          git fetch origin "${{ github.head_ref }}"
          git checkout -B "${{ github.head_ref }}" FETCH_HEAD
          if [[ ! -f scripts/apply_v543_operational_dynamics.py ]]; then
            echo "v5.4.3 bootstrap already applied"
            exit 0
          fi
          python3 scripts/apply_v543_operational_dynamics.py
          rm -f scripts/apply_v543_operational_dynamics.py scripts/apply_v543_operational_dynamics_delta.py scripts/.v543_payload_1 scripts/.v543_payload_2 scripts/.v543_payload_3 scripts/.v543_payload_4
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: compare current and previous exports in indicators"
          git push origin HEAD:${{ github.head_ref }}
      # V543_BOOTSTRAP_END

      - name: Classify changes
        id: changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "pipeline=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only HEAD^ HEAD)"
          printf '%s\n' "$changed"

          if printf '%s\n' "$changed" | grep -Eq '^(app/.*\.(ts|tsx|css)|lib/|offline/|package(-lock)?\.json|scripts/build-offline\.mjs|scripts/build-verified\.sh|scripts/sites-env\.sh|scripts/validate-artifact\.sh|tests/rendered-html\.test\.mjs)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

          if printf '%s\n' "$changed" | grep -Eq '^(scripts/pipeline/|scripts/weekly_update_pipeline\.py|config/import-pipeline\.json|tests/update-adapters\.test\.mjs|tests/update-pipeline\.test\.mjs)'; then
            echo "pipeline=true" >> "$GITHUB_OUTPUT"
          else
            echo "pipeline=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare executable scripts
        run: chmod +x scripts/*.sh scripts/pipeline/*.sh 2>/dev/null || true

      - name: Install Python pipeline dependencies
        if: steps.changes.outputs.pipeline == 'true'
        run: python3 -m pip install --disable-pip-version-check openpyxl

      - name: Validate UTF-8 and JSON integrity
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          checked = 0
          for root in ("app", "config", "baseline"):
              for path in sorted(Path(root).rglob("*.json")):
                  text = path.read_text(encoding="utf-8")
                  json.loads(text)
                  checked += 1
          print(f"JSON integrity: PASS; files={checked}")
          PY

      - name: Verify release consistency
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          manifest = json.loads(Path("baseline/manifest.json").read_text(encoding="utf-8"))
          page = Path("app/page.tsx").read_text(encoding="utf-8")
          match = re.search(r'const DASHBOARD_VERSION = "([^"]+)"', page)
          assert match, "DASHBOARD_VERSION not found"
          version = match.group(1)
          assert version == manifest["baselineVersion"], (version, manifest["baselineVersion"])

          errors = json.loads(Path("app/error-categories.json").read_text(encoding="utf-8"))
          error_org = json.loads(Path("app/error-organizations.json").read_text(encoding="utf-8"))
          assert errors["total"] == sum(int(item["count"]) for item in errors["items"]), "error category total mismatch"
          assert error_org["totalErrors"] == errors["total"], "error organization total mismatch"
          assert "organizationBreakdown" not in errors, "duplicate error organization payload must stay in error-organizations.json only"

          print(f"Release consistency: PASS; version={version}; REMD errors={errors['total']}")
          PY

      - name: Validate calculations and metadata
        run: npm run validate:refactor

      - name: Run fast regression tests
        shell: bash
        run: |
          mapfile -t core_tests < <(
            find tests -maxdepth 1 -name '*.test.mjs' \
              ! -name 'rendered-html.test.mjs' \
              ! -name 'update-adapters.test.mjs' \
              ! -name 'update-pipeline.test.mjs' \
              -print | sort
          )
          test "${#core_tests[@]}" -gt 0
          node --test "${core_tests[@]}"

      - name: Validate staging adapters
        if: steps.changes.outputs.pipeline == 'true'
        run: python3 scripts/pipeline/adapter_selftest.py

      - name: Run pipeline regression tests
        if: steps.changes.outputs.pipeline == 'true'
        run: node --test tests/update-adapters.test.mjs tests/update-pipeline.test.mjs

      - name: Run full application build
        if: steps.changes.outputs.code == 'true'
        run: npm run build

      - name: Run rendered HTML regression test
        if: steps.changes.outputs.code == 'true'
        run: node --test tests/rendered-html.test.mjs

      - name: Build single-file static dashboard
        run: |
          rm -rf _site
          mkdir -p _site
          OFFLINE_OUTPUT_DIR=_site OFFLINE_BASENAME=index node scripts/build-offline.mjs
          rm -f _site/index.zip
          touch _site/.nojekyll

      - name: Verify Pages artifact
        run: |
          test -s _site/index.html
          VERSION="$(python3 -c 'import json; print(json.load(open("baseline/manifest.json", encoding="utf-8"))["baselineVersion"])')"
          grep -Fq "$VERSION" _site/index.html
          grep -q 'hearingMetricGroup' _site/index.html
          grep -q 'hearingTopTen' _site/index.html

      - name: Package current source workspace
        run: |
          VERSION="$(python3 -c 'import json; print(json.load(open("baseline/manifest.json", encoding="utf-8"))["baselineVersion"])')"
          git archive --format=tar.gz --output="dashboard-source-${VERSION}.tar.gz" HEAD
          echo "SOURCE_PACKAGE=dashboard-source-${VERSION}.tar.gz" >> "$GITHUB_ENV"

      - name: Upload source workspace artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-source-workspace
          path: ${{ env.SOURCE_PACKAGE }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
