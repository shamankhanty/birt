name: Deploy dashboard to GitHub Pages

# Project Pages URL follows the current repository name (birt).
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare executable scripts
        run: chmod +x scripts/*.sh scripts/pipeline/*.sh 2>/dev/null || true

      - name: Install Python validation dependencies
        run: python3 -m pip install --disable-pip-version-check openpyxl

      - name: Verify requested v5.2.4 controls in source
        run: |
          grep -Fq 'const DASHBOARD_VERSION = "5.2.4"' app/page.tsx
          grep -Fq 'function hearingDisplayGroup(metric: HearingMetric)' app/page.tsx
          grep -Fq 'СЭМД относительно случаев / обращений' app/page.tsx
          grep -Fq 'Справочные / неприменимые / без сопоставимого плана / без необходимых данных' app/page.tsx
          grep -Fq '01.08–31.08.2026' app/error-categories.json
          grep -Fq '785939' app/error-categories.json

      - name: Validate calculations and metadata
        run: npm run validate:refactor

      - name: Validate staging adapters
        run: python3 scripts/pipeline/adapter_selftest.py

      - name: Run regression tests
        run: npm test

      - name: Build single-file static dashboard
        run: |
          rm -rf _site
          mkdir -p _site
          OFFLINE_OUTPUT_DIR=_site OFFLINE_BASENAME=index node scripts/build-offline.mjs
          rm -f _site/index.zip
          touch _site/.nojekyll

      - name: Verify Pages artifact
        run: |
          test -s _site/index.html
          grep -q '5.2.4' _site/index.html
          grep -q 'hearingMetricGroup' _site/index.html
          # The offline compiler serializes the en dash as \u2013 in embedded JSON.
          grep -Fq '01.08\u201331.08.2026' _site/index.html
          grep -Eq '785.?939|785939' _site/index.html
          grep -q 'hearingTopTen' _site/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
