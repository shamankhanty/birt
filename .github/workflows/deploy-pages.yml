name: Deploy dashboard to GitHub Pages

# Project Pages URL follows the current repository name (birt).
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Prepare executable scripts
        run: chmod +x scripts/*.sh scripts/pipeline/*.sh 2>/dev/null || true

      - name: Install Python validation dependencies
        run: python3 -m pip install --disable-pip-version-check openpyxl

      - name: Preserve visible extended-summary filter fix
        run: python3 scripts/fix_extended_status_button.py

      - name: Apply v5.2.3 changes
        run: python3 scripts/apply_v523.py

      - name: Verify requested v5.2.3 controls in source
        run: |
          grep -Fq 'const DASHBOARD_VERSION = "5.2.3"' app/page.tsx
          grep -Fq 'onClick={() => setExtendedStatusFilter("exceptContract")}' app/page.tsx
          grep -Fq 'className="maxServiceSwitch"' app/page.tsx
          ! grep -q 'regionalMaxPanel' app/page.tsx
          grep -Fq 'developmentSection ${tab === "max"' app/page.tsx
          grep -Fq '01.08–31.08.2026' app/error-categories.json
          grep -Fq '785939' app/error-categories.json
          grep -Fq 'v5.2.3 hearing TOP-10 readability' app/globals.css

      - name: Validate calculations and metadata
        run: npm run validate:refactor

      - name: Validate staging adapters
        run: python3 scripts/pipeline/adapter_selftest.py

      - name: Run regression tests
        run: npm test

      - name: Build single-file static dashboard
        run: |
          rm -rf _site
          mkdir -p _site
          OFFLINE_OUTPUT_DIR=_site OFFLINE_BASENAME=index node scripts/build-offline.mjs
          rm -f _site/index.zip
          touch _site/.nojekyll

      - name: Verify Pages artifact
        run: |
          test -s _site/index.html
          grep -q '5.2.3' _site/index.html
          grep -q 'exceptContract' _site/index.html
          grep -q 'maxServiceSwitch' _site/index.html
          # The offline compiler serializes the en dash as \u2013 in embedded JSON.
          grep -Fq '01.08\u201331.08.2026' _site/index.html
          grep -Eq '785.?939|785939' _site/index.html
          grep -q 'hearingTopTen' _site/index.html

      - name: Commit verified v5.2.3 source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/globals.css app/error-categories.json app/error-organizations.json \
                  README.md STATE.md OPEN_ISSUES.md baseline/manifest.json \
                  tests/error-mo-drilldown.test.mjs tests/ui-remarks-v522.test.mjs
          if ! git diff --cached --quiet; then
            git commit -m "v5.2.3: apply requested UI and monthly REMD changes"
            git push origin main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
