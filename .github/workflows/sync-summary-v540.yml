name: Sync v5.4.0 extended summary

on:
  push:
    branches: ["main"]

permissions:
  contents: write

concurrency:
  group: "sync-summary-v540"
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Apply extended summary synchronization
        run: python3 scripts/apply_summary_sync_v540.py

      - name: Install Python validation dependencies
        run: python3 -m pip install --disable-pip-version-check openpyxl

      - name: Validate calculations and metadata
        run: npm run validate:refactor

      - name: Run regression tests and production build
        run: npm test

      - name: Commit synchronized v5.4.0 source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No synchronized changes to commit"; exit 1; }
          git commit -m "sync: v5.4.0 extended summary cards"
          git push origin HEAD:main
