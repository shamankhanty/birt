name: Finalize v5.4.0 source

on:
  push:
    branches: ["main"]

permissions:
  contents: write

concurrency:
  group: "finalize-v540"
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.head_commit.message != 'release: v5.4.0'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install and materialize v5.4.0 candidate
        run: npm ci --no-audit --no-fund

      - name: Install Python validation dependencies
        run: python3 -m pip install --disable-pip-version-check openpyxl

      - name: Validate calculations and metadata
        run: npm run validate:refactor

      - name: Run regression tests and production build
        run: npm test

      - name: Remove one-off bootstrap hook
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('package.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          data.get('scripts', {}).pop('postinstall', None)
          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit finalized source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No finalized changes to commit"; exit 1; }
          git commit -m "release: v5.4.0"
          git push origin HEAD:main
