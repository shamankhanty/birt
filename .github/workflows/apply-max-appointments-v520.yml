name: Verify MAX appointments v5.2.0

on:
  push:
    branches:
      - feature/max-appointments-municipal
    paths:
      - 'app/max-appointments-municipal.json'
      - 'scripts/apply_max_appointments_page_patch.py'
      - 'scripts/promote_v520_manifest.py'
      - 'scripts/finalize_v520_docs.py'
      - 'tests/max-section.test.mjs'
      - 'tests/hearing-snapshots.test.mjs'
      - 'tests/baseline-lock.test.mjs'
      - 'baseline/manifest.json'
      - 'README.md'
      - 'STATE.md'
      - 'OPEN_ISSUES.md'
      - 'build/sites-vite-plugin.ts'
      - 'worker/index.ts'
      - '.github/workflows/apply-max-appointments-v520.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/max-appointments-municipal

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: python3 -m pip install openpyxl

      - name: Restore executable flags
        run: chmod +x scripts/*.sh

      - name: Apply MAX municipality page patch
        run: python3 scripts/apply_max_appointments_page_patch.py

      - name: Finalize v5.2.0 documentation
        run: python3 scripts/finalize_v520_docs.py

      - name: Refresh v5.2.0 baseline hashes
        run: python3 scripts/promote_v520_manifest.py

      - name: Install Node dependencies
        run: npm ci

      - name: Validate calculations and metadata
        run: npm run validate:refactor

      - name: Validate staging adapters
        run: python3 scripts/pipeline/adapter_selftest.py

      - name: Production build
        run: npm run build

      - name: Run full tests
        run: node --test tests/*.test.mjs

      - name: Commit generated baseline
        run: |
          if git diff --quiet -- app/page.tsx baseline/manifest.json README.md STATE.md OPEN_ISSUES.md; then
            echo "Generated v5.2.0 files are already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+shamankhanty@users.noreply.github.com"
          git add app/page.tsx baseline/manifest.json README.md STATE.md OPEN_ISSUES.md
          git commit -m "Фиксация baseline v5.2.0 после полного gate"
          git push
