name: Finalize v5.4.0 source

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: python3 -m pip install --disable-pip-version-check openpyxl
      - run: npm run validate:refactor
      - run: npm test
      - run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('package.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          data.get('scripts',{}).pop('postinstall',None)
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          rm -f .github/workflows/finalize-v540-fixed.yml .github/workflows/finalize-v540.yml
          git config user.name github-actions-bot
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m "release v5.4.0"
          git push origin HEAD:main
