name: Materialize v5.4.5

on:
  push:
    branches:
      - fix/physician500-operational-history-v545
    paths:
      - scripts/apply_v545_physician_operational_history.py
      - .github/workflows/materialize-v545.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/physician500-operational-history-v545
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply v5.4.5 patch
        run: python3 scripts/apply_v545_physician_operational_history.py
      - name: Validate regression target
        run: node --test tests/physician500-operational-history.test.mjs
      - name: Validate calculations and metadata
        run: npm run validate:refactor
      - name: Build application
        run: npm run build
      - name: Commit materialized release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: materialize v5.4.5 operational 500+ and version history"
          git push origin HEAD:fix/physician500-operational-history-v545
