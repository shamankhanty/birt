name: Materialize v5.4.4

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'fix/cumulative-component-dynamics-v544'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 2

      - name: Apply v5.4.4 release changes
        run: python3 scripts/apply_v544.py

      - name: Commit materialized release
        shell: bash
        run: |
          rm -f .github/workflows/materialize-v544.yml
          git config user.name "shamankhanty"
          git config user.email "148852731+shamankhanty@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: show cumulative numerator and denominator dynamics"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
